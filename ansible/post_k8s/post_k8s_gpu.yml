---
- name: Install NVIDIA Container Toolkit on GPU node
  hosts: node4
  become: yes
  tasks:
    - name: Add NVIDIA container toolkit GPG key
      shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | \
          gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      args:
        creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

    - name: Add NVIDIA container toolkit repository
      shell: |
        curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
          sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
          tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

    - name: Install NVIDIA container toolkit
      apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: yes

    - name: Configure Docker to use NVIDIA runtime
      command: nvidia-ctk runtime configure --runtime=docker --set-as-default

    - name: Restart Docker
      systemd:
        name: docker
        state: restarted

- name: Deploy NVIDIA Device Plugin and configure GPU node
  hosts: node1
  become: yes
  vars:
    ansible_user: cc
  tasks:
    - name: Deploy NVIDIA device plugin DaemonSet
      command: >
        kubectl apply -f
        https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.18.2/deployments/static/nvidia-device-plugin.yml
      become_user: "{{ ansible_user }}"

    - name: Label GPU node for scheduling
      command: kubectl label node node4 node-role=gpu --overwrite
      become_user: "{{ ansible_user }}"

    - name: Taint GPU node to prevent non-GPU workloads
      command: kubectl taint nodes node4 nvidia.com/gpu=present:NoSchedule --overwrite
      become_user: "{{ ansible_user }}"

    - name: Verify GPU node setup
      shell: |
        echo "=== Node Labels ==="
        kubectl get node node4 --show-labels
        echo "=== Node Taints ==="
        kubectl describe node node4 | grep -A5 Taints
      become_user: "{{ ansible_user }}"
      register: gpu_verify

    - name: Show GPU node status
      debug:
        msg: "{{ gpu_verify.stdout_lines }}"
